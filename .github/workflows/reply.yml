name: コメントに自動返信

on:
  schedule:
    # 日本時間 7:50 / 9:30 / 12:50 / 15:30 / 18:30 / 21:50
    - cron: "50 22 * * *"
    - cron: "30 0 * * *"
    - cron: "50 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 9 * * *"
    - cron: "50 12 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト実行（投稿せず、返信文の作成だけ確認）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Claude Code を準備
        run: npm install -g @anthropic-ai/claude-code >/dev/null
      - name: コメントに返信
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPLY_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python auto_reply.py
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/replied.json data/escalations.json data/reply_log.txt; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "コメント返信の記録を更新"
            git pull --rebase origin main
            git push
          fi
