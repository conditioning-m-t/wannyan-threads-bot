name: コメントに自動返信

on:
  schedule:
    # 5分おきに新しいコメントを確認し、あればすぐ返信する（24時間）
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "sample=見本で確認 / preview=実際のコメントで下見（投稿しない） / live=実際に返信"
        type: choice
        options: [preview, sample, live]
        default: preview

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: reply-job
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 新しいコメントを確認
        id: check
        if: github.event_name == 'schedule'
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          REPLY_CHECK: "1"
        run: python auto_reply.py
      - name: Claude Code を準備
        if: github.event_name != 'schedule' || steps.check.outputs.pending > 0
        run: npm install -g @anthropic-ai/claude-code >/dev/null
      - name: コメントに返信
        if: github.event_name != 'schedule' || steps.check.outputs.pending > 0
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REPLY_TEST: ${{ github.event_name != 'workflow_dispatch' && '0' || inputs.mode == 'sample' && '1' || inputs.mode == 'preview' && 'preview' || '0' }}
        run: python auto_reply.py
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/replied.json data/escalations.json data/reply_log.txt; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "コメント返信の記録を更新"
            git pull --rebase origin main
            git push
          fi
