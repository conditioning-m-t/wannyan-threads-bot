name: 合鍵を自動更新

on:
  schedule:
    # 毎週月曜 日本時間 4:17（合鍵の期限は約60日。毎週延長して切れないようにする）
    - cron: "17 19 * * 0"
  workflow_dispatch:
  # 書き換え用の合鍵を登録したあと、こちらから1回目を動かすため
  push:
    branches: [main]
    paths:
      - "accounts/refresh_request.txt"

permissions:
  contents: write

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: echo "matrix=$(python3 bot/account.py all)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix) }}
    env:
      ACCOUNT: ${{ matrix.account }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 合鍵を延長してシークレットに書き戻す
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets[matrix.secret] || (matrix.account == 'wannyan' && secrets.THREADS_ACCESS_TOKEN || '') }}
          SECRETS_WRITER_TOKEN: ${{ secrets.SECRETS_WRITER_TOKEN }}
        run: python refresh_token.py
      - name: 結果（期限の日付だけ）を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in "data/token_status.json" "accounts/$ACCOUNT/data/token_status.json"; do git add -A -- "$f" 2>/dev/null; done
          if ! git diff --cached --quiet; then
            git commit -m "合鍵の更新結果（$ACCOUNT）"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((i * 5))
            done
          fi
