name: 動画を投稿

# video_posts/ に status: "pending" のファイルを push すると、その動画を1本投稿する
on:
  push:
    branches: [main]
    paths: ["video_posts/**"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト実行（実際には投稿しない）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: video-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 投稿
        id: post
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python post_video.py
      - name: 結果を記録
        if: always() && (github.event_name == 'push' || !inputs.dry_run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "動画投稿の結果を記録"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
