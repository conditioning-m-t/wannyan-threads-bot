name: 新アカウント：反応データを収集

on:
  schedule:
    # 日本時間 17:47（毎晩の案づくりの前）
    - cron: "47 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          m=$(python3 bot/account.py new )
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c "import json,sys;print(len(json.loads(sys.argv[1])[\"include\"]))" "$m")" >> "$GITHUB_OUTPUT"

  collect:
    needs: accounts
    if: needs.accounts.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix) }}
    env:
      ACCOUNT: ${{ matrix.account }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 反応データを取得
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets[matrix.secret] }}
        run: python collect_insights.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in insights.json followers.json; do git add -A -- "accounts/$ACCOUNT/data/$f" 2>/dev/null; done
          if ! git diff --cached --quiet; then
            git commit -m "反応データを更新（$ACCOUNT）"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((i * 5))
            done
          fi
