name: 反応データを収集

on:
  schedule:
    # 日本時間 17:53（下書き作成の前）
    - cron: "53 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 反応データを取得
        working-directory: bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python collect_insights.py
      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/insights.json data/followers.json; do [ -f "$f" ] && git add "$f"; done
          if ! git diff --cached --quiet; then
            git commit -m "反応データを更新"
            # GitHubの一時的な障害（500）で保存に失敗することがあるので、やり直す
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((i * 5))
            done
          fi
